
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connexion - DSI Trésor Mali</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #123c69, #2563a6);
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            margin: 20px;
            padding: 32px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            margin: 0 0 10px;
            text-align: center;
            color: #123c69;
        }

        .description {
            margin-bottom: 28px;
            text-align: center;
            color: #64748b;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #334155;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #93c5fd;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #123c69;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4f91;
        }

        .footer {
            margin-top: 24px;
            text-align: center;
            color: #64748b;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <main class="login-container">

        <h1>DSI Trésor Mali</h1>

        <p class="description">
            Connectez-vous à votre espace de travail
        </p>

        <form action="login.php" method="POST">

            <label for="nom_utilisateur">
                Nom d'utilisateur
            </label>

            <input
                type="text"
                id="nom_utilisateur"
                name="nom_utilisateur"
                placeholder="Entrez votre nom d'utilisateur"
                autocomplete="username"
                required
            >

            <label for="mot_de_passe">
                Mot de passe
            </label>

            <input
                type="password"
                id="mot_de_passe"
                name="mot_de_passe"
                placeholder="Entrez votre mot de passe"
                autocomplete="current-password"
                required
            >

            <button type="submit">
                Se connecter
            </button>

        </form>

        <p class="footer">
            Accès réservé aux utilisateurs autorisés
        </p>

    </main>

</body>
</html>
